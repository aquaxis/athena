# ATHENA configuration — defaults generated by `athena init` (ATH-CLI-009).
#
# Resolution precedence is defaults < this file < ATHENA_* environment < CLI options
# (ATH-CFG-001). Validation is fail-fast (ATH-CFG-003): startup aborts on any violation.
#
# ATHENA holds no provider or model default (ATH-AGENT-008): fill in
# `core.agent.provider` and `core.agent.model` before the first start. A fresh copy of
# this file therefore validates apart from those two values, by design — the empty value
# is the fail-fast reminder to choose.
#
# Secrets never belong in this file (ATH-CFG-005): API tokens and provider keys come from
# environment variables or a secret manager. `${athena.home}` expands to `<PROJECT_ROOT>
# /.athena` before validation; no other variable reference is permitted (ATH-CFG-010).

athena:
  home: "./.athena"
  api:
    # Loopback by default: v1 is single host, single user (ATH-OPS-004). A second Athina
    # on the same host needs its own port (ATH-OPS-007).
    host: "127.0.0.1"
    port: 8080
    auth:
      # `token` (static bearer tokens) is the v1 scheme; `none` is accepted only with
      # host 127.0.0.1 (ATH-CFG-006).
      mode: "token"
  data:
    dir: "${athena.home}/var"
    database: "${athena.home}/var/athena.db"

core:
  max_iterations: 50
  iteration_timeout: "30m"
  evaluation:
    # Verifiable deliverables must pass objective Verification before acceptance
    # (ATH-EVAL-002).
    require_verification: true
  agent:
    persona: "${athena.home}/personas/producer.md"
    workspace: "${athena.home}/var/core-agent"
    runtime: "agent-cli"
    provider: "" # MUST set — no ATHENA-side default (ATH-AGENT-008)
    model: "" # MUST set — no ATHENA-side default (ATH-AGENT-008)
    skills: []
    restart:
      max_attempts: 3
      on_exhausted: "escalate"
    # Minimal by default; shell / process / network never belong here (ATH-SEC-025).
    allowed_tools: ["fs_read", "fs_write", "send_to"]
    # Empty by default: the permission ceiling must be stated explicitly (ATH-SEC-024).
    delegable_tools: []

scheduler:
  # All of these are provisional initial values for one development host, to be settled
  # by measurement and a spec revision (ATH-SCHED-015) — hard-coding them elsewhere is
  # forbidden.
  max_concurrent_tasks: 8
  max_concurrent_instances: 16
  max_instances_per_task: 4
  max_queue_length: 1000
  priority_promotion_interval: "30m"
  # Held outside max_concurrent_instances so Core Agent can always start (ATH-SCHED-008).
  reserved_core_agent_slots: 2
  max_waiting_approval_ratio: 0.25
  stall_detection_factor: 2

messaging:
  max_queue_depth: 1000
  dedup_retention: "7d"

timeout:
  startup: "30s"
  execution: "30m"
  # Must exceed startup + execution (ATH-CFG-008).
  message_reply: "45m"
  approval: "1h"
  stop: "1m"
  clarification: "24h"

policy:
  # Evaluated top-down, first match wins; an operation matching no rule is `high`
  # (ATH-CFG-009).
  rules:
    - match:
        tool: "shell"
        args_pattern: "^git\\s+push"
      risk: "high"
      requires_approval: true
    - match:
        tool: "shell"
        args_pattern: "^rm\\s+-rf"
      risk: "high"
      requires_approval: true
    - match:
        tool: "network"
        hosts: ["*"]
      risk: "high"
      requires_approval: true
    - match:
        tool: "fs_write"
        path_scope: "outside_workspace"
      risk: "high"
      requires_approval: true
    - match:
        tool: "shell"
      risk: "medium"
      requires_approval: false
    - match:
        tool: "fs_read"
      risk: "low"
      requires_approval: false
  # An approval scope must be chosen from this list; arbitrary agent-specified patterns
  # are refused (ATH-HITL-012).
  approval_scopes: ["operation_only", "tool:shell:same_argv", "tool:fs_write:same_path"]
  max_approval_ttl: "24h"

runtime:
  default: "agent-cli"
  agent-cli:
    max_instances: 16
    command: "agent-cli"

skills:
  local_dir: "${athena.home}/skills"
  dir: "${athena.home}/var/skills"
  auto_enable_on_register: false
  verify_checksum: true
  # Empty by default: an empty allow-list denies every external fetch (ATH-SKILL-035).
  allowed_publishers: []
  allowed_sources: []

memory:
  # Must be stated explicitly; implicit provider defaults are forbidden (ATH-MEM-009).
  tokenizer: "provider-default-claude"
  # Eviction summarization is delegated to this agent, never Core Host logic (ATH-MEM-008).
  summarizer: "memory-summarizer-agent"
  short_term_max_tokens: 32000
  working_max_records: 500
  long_term:
    enabled: true
    max_records: 10000

approval:
  on_timeout: "reject"

core_agent_restart:
  max_attempts: 3
  window: "1h"
  exclude_error_classes: ["TransientError"]
  heartbeat_interval: "20s"
  heartbeat_timeout: "1m"

retry:
  max_attempts: 3
  strategy: "alternate-agent"
  backoff:
    initial_ms: 1000
    multiplier: 2.0
    max_ms: 60000

events:
  retention_days: 90

observability:
  # Full agent input/output is logged only at `debug` (ATH-OBS-005).
  log_level: "info"
  log_format: "json"

# Agent definitions registered statically. Define at least the Core Agent's runtime; the
# provider and model go into `core.agent` above (ATH-AGENT-008).
agents: []
